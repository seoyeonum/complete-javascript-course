<!-- VSCode 의 단축키 기능: html5 기본 문서 구조가 자동 완성 → ! + \t -->
<!-- Extension의 Auto Rename Tag, Auto Close Tag 설치 시 코드 작성에 용이하다.-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 페이지 제목 -->
    <title>Learning HTML & CSS</title>
  </head>
  <body>
    <!-- h1 ~ h6 까지 존재 -->
    <h1>JavaScript is fun, but so is HTML & CSS!</h1>
    <p class="first">
      You can learn JavaScript sithout HTML, but for DOM manipulation it's
      useful to have som basic ideas of HTML & CSS. You can learn more about it
      <a href="https://www.udemy.com/user/jonasschmedtmann/">on Udemy</a>
    </p>

    <h2>Another heading</h2>
    <p class="second">Just another paragraph</p>

    <!-- id 는 유일해야 하며, class 는 중복될 수 있다. -->
    <img
      id="course-image"
      src="https://img-c.udemycdn.com/course/750x422/1672410_9ff1_5.jpg"
    />

    <form id="your-name">
      <!-- CSS를 위한 id 작성은 하이픈(-)으로 연결해서 작명 -->
      <h2>Your name here</h2>
      <p>Please fill in ths form :)</p>
      <input type="text" placeholder="Your name" />
      <button>OK!</button>
    </form>
  </body>
</html>
